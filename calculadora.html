<!-- Página de la calculadora -->
<!DOCTYPE html>
<html>
<head>
  <title> Calculadora - Rafael González Lozano </title> <!-- Título de la página -->
  <link href="css/estilos.css" rel="stylesheet" type="text/css" > <!-- Hacemos el enlace a nuestro archivo de estilos -->

<!-- Lógica de la calculadora -->
<script type="text/javascript">
function vaciar () {
    let num = document.getElementById("n1");
    
    <!-- EXTRA: Cuando termine una operación volvemos a mostrar la información inicial -->
    if (num.value != "") { <!-- Excepción para evitar errores con las operaciones binarias -->
        num.value = "";
        document.getElementById("info").innerHTML = "Información sobre el número";
        document.getElementById("operacion-info").innerHTML = ""; <!-- Limpiamos la información de la operación -->
    }
}

<!-- Campo de información -->
function fill_info() {
  let num = document.getElementById("n1").value;
  let info = document.getElementById("info");
  if (num < 100) {
    info.innerHTML = "Info: El resultado es menor que 100";
  } else if (num <= 200) {
    info.innerHTML = "Info: El resultado está entre 100 y 200";
  } else {
    info.innerHTML = "Info: El resultado es mayor que 200";
  }
}

<!-- Operaciones base -->
function square() { <!-- He cambiado el nombre de cuadrado a square por si hay confusión con el enunciado -->
  if (validate()) { <!-- Validamos la entrada -->
    let num = document.getElementById("n1");
    num.value = num.value * num.value;
    fill_info(); <!-- Añadimos la llamada a fill_info -->
  }
}
<!-- En el enunciado no la menciona pero está -->
function inverso() {
  if (validate()) { <!-- Validamos la entrada -->
    let num = document.getElementById("n1");
    num.value = 1 / num.value;
    fill_info(); <!-- Añadimos la llamada a fill_info -->
  }
}

<!-- Operaciones unarias -->

<!-- Operación de valor absoluto -->
let mod = () => {
  if (validate()) { <!-- Validamos la entrada -->
    let num = document.getElementById("n1");
    if (num.value < 0) {
      num.value = -num.value;
    }
    fill_info(); <!-- Añadimos la llamada a fill_info -->
  }
};

<!-- Operación de factorial-->
let fact = () => {
  if (validate()) { <!-- Validamos la entrada -->
    let num = document.getElementById("n1");
    let x = num.value;
    let resultado = 1;
    while (x > 1) {
      resultado = resultado * x;
      x--;
    };
    num.value = resultado;
    fill_info(); <!-- Añadimos la llamada a fill_info -->
  }
};

<!-- EXTRA: Elevación al cubo (No lo menciona en el enunciado pero lo menciona en la rúbrica) -->
let cubo = () => {
  if (validate()) { <!-- Validamos la entrada -->
    let num = document.getElementById("n1");
    num.value = num.value * num.value * num.value;
    fill_info(); <!-- Añadimos la llamada a fill_info -->
  }
};

<!-- Operaciones binarias -->

<!-- Variables globales para almacenar el primer número y el operador -->
let primerNumero;
let operador;

<!-- Función que almacena número y operador -->
function almacenarNumYOp(op) {
  if (validate()) { <!-- Validamos la entrada -->
    primerNumero = document.getElementById("n1").value;
    operador = op;
    <!-- EXTRA: Mostramos la operación que se va a realizar, para saber qué operación se está realizando. Me parece que mejora el UX -->
    document.getElementById("info").innerHTML = 
      "Operación: " + primerNumero + " " + operador;
    document.getElementById("n1").value = "";
  }
}

<!-- Función para calcular el resultado -->
function eq() {
  if (validate()) { <!-- Validamos la entrada -->
    let segundoNumero = document.getElementById("n1").value;
    let resultado;
    <!-- Extra: Mostramos el resultado-->
    if (operador == "+") {
      resultado = +primerNumero + +segundoNumero;
      document.getElementById("operacion-info").innerHTML =
      "Operación: Suma. El resultado es " + resultado;
    } else if (operador == "*") {
      resultado = primerNumero * segundoNumero;
      document.getElementById("operacion-info").innerHTML =
      "Operación: Multiplicación. El resultado es " + resultado;
    }
  }
  document.getElementById("n1").value = resultado;
  fill_info(); <!-- Añadimos la llamada a fill_info -->
}

<!-- Operaciones con CSV (Valores separados por comas)-->

<!-- Suma todos los valores de la lista-->
function sum() {
  if (validate()) { <!-- Validamos la entrada -->
    let input = document.getElementById("n1").value;
    let arr = input.split(",");
    let i = 0;
    let resultado = 0;
    while (i < arr.length) {
      resultado += Number(arr[i]);
      i++;
    };
    document.getElementById("n1").value = resultado;
    document.getElementById("operacion-info").innerHTML =
      "Lista de valores procesada: se han sumado los valores. El resultado es " + resultado; <!-- Extra: Mostramos el resultado -->
    fill_info(); <!-- Añadimos la llamada a fill_info -->
  }
}


<!-- Ordena los valores en orden ascendente -->
function sort() {
  if (validate()) {
    let input = document.getElementById("n1").value;
    let arr = input.split(",");
    arr.sort(function(a, b) {
      return Number(a) - Number(b);
    });
    document.getElementById("n1").value = arr.join(",");
    document.getElementById("operacion-info").innerHTML =
      "Lista de valores procesada: se han ordenado los valores. El resultado es " + arr.join(","); <!-- Extra: Mostramos el resultado -->
  }
}


<!-- Invierte el orden de la lista -->
function reverse() {
  if (validate()) {
    let input = document.getElementById("n1").value;
    let arr = input.split(",");
    arr.reverse();
    document.getElementById("n1").value = arr.join(",");
    document.getElementById("operacion-info").innerHTML =
      "Lista de valores procesada: se ha invertido el orden de los valores. El resultado es " + arr.join(","); <!-- Extra: Mostramos el resultado -->
  }
}


<!-- Elimina el último valor de la lista -->
function removelast() {
  if (validate()) {
    let input = document.getElementById("n1").value;
    let arr = input.split(",");
    arr.pop();
    document.getElementById("n1").value = arr.join(",");
    document.getElementById("operacion-info").innerHTML =
      "Lista de valores procesada: se ha eliminado el último valor. El resultado es " + arr.join(","); <!-- Extra: Mostramos el resultado -->
  }
}


<!-- EXTRA: Cálculo de la media (Aparece mencionado en la rúbrica)-->
function media() {
  if (validate()) {
    let input = document.getElementById("n1").value;
    let arr = input.split(",");
    let i = 0;
    let resultado = 0;
    while (i < arr.length) {
      resultado += Number(arr[i]);
      i++;
    };
    resultado = resultado / arr.length;
    document.getElementById("n1").value = resultado;
    document.getElementById("operacion-info").innerHTML =
      "Lista de valores procesada: se ha calculado la media. El resultado es " + resultado; <!-- Extra: Mostramos el resultado -->
    fill_info();
  }
}

<!-- Gestión de errores -->
<!-- Nota:Deben mostrarse mensajes apropiados según el tipo de error. CUALES SON ESOS TIPOS DE ERRORES? -->
function validate() {
  let input = document.getElementById("n1").value;
  let arr = input.split(",");
  let i = 0;
  try {
    while (i < arr.length) {
      if (Number(arr[i]) || arr[i] == "0") {
        i++;
      } else {
        throw("Error: No se ha detectado un número");
      }
    }
    return true;
  } catch (error) {
    document.getElementById("info").innerHTML = error;
    return false;
  }
}
</script>
</head>

<!-- Nombre de la página -->

   Calculadora

  <h2>
    Comienza a usar nuestra maravillosa calculadora
  </h2>

<!-- Contenido principal de la calculadora -->
<main class="calculadora-contenido">

<!-- Campo de información -->
  <section class="bloque-calculadora">

    <h2 id="info" class="big" title="Información sobre el número">
        Información sobre el número
    </h2>

    <div class="entrada-calculadora">
        Número:
        <input type="text" id="n1" onclick="vaciar()">
    </div>

    <!-- Información sobre la operación realizada -->
    <p id="operacion-info"></p>
  </section>

<!-- Operaciones base -->
  <section class="bloque-calculadora">
    <h2>Operaciones base:</h2>
    <div class="botones-calculadora">
      <button onclick="square()">x<sup>2</sup></button>
      <button onclick="inverso()">1/x</button>
    </div>
  </section>

<!-- Operaciones unarias -->
  <section class="bloque-calculadora">
    <h2>Operaciones unarias:</h2>
    <div class="botones-calculadora">
      <button onclick="mod()">Módulo</button>
      <button onclick="fact()">Factorial</button>
      <button onclick="cubo()">x<sup>3</sup></button>
    </div>
  </section>

<!-- Operaciones binarias -->
  <section class="bloque-calculadora">
    <h2>Operaciones binarias:</h2>
    <div class="botones-calculadora">
        <button onclick="almacenarNumYOp('+')">+</button>
        <button onclick="almacenarNumYOp('*')">*</button>
        <button onclick="eq()">=</button>
    </div>
  </section>

<!-- Operaciones con CSV -->
  <section class="bloque-calculadora">
    <h2>Operaciones con CSV:</h2>
    <div class="botones-calculadora">
        <button onclick="sum()">Suma</button>
        <button onclick="sort()">Ordenar</button>
        <button onclick="reverse()">Invertir</button>
        <button onclick="removelast()">Eliminar último</button>
        <button onclick="media()">Media</button>
    </div>
  </section>
</main>
